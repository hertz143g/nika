<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ника — персональный ИИ-репетитор, который помогает ребёнку разобраться со школьной программой."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Ника — персональный ИИ-репетитор</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page" aria-label="Ника — персональный ИИ-репетитор">
      <div
        class="desktop-layout"
        role="img"
        aria-label="Полная десктопная версия лендинга Ника"
      ></div>

      <div class="mobile-layout">
        <section id="intro" aria-label="Первый экран и как это работает">
          <img
            src="./assets/nika-mobile-01.png"
            width="390"
            height="1369"
            alt="Ребёнок не понял тему в школе? Ника объяснит по-другому"
            fetchpriority="high"
          />
        </section>
        <section aria-label="Знакомые ситуации">
          <img
            src="./assets/nika-mobile-02.png"
            width="390"
            height="1068"
            alt="Знакомые ситуации при выполнении школьных заданий"
            loading="lazy"
          />
        </section>
        <section id="how-it-works" aria-label="От вопроса до понимания">
          <img
            src="./assets/nika-mobile-03.png"
            width="390"
            height="800"
            alt="Четыре шага от вопроса до понимания"
            loading="lazy"
          />
        </section>
        <section aria-label="Объяснение разными способами">
          <img
            src="./assets/nika-mobile-04.png"
            width="390"
            height="1261"
            alt="Одну тему можно объяснить по-разному"
            loading="lazy"
          />
        </section>
        <section aria-label="Школьные предметы">
          <img
            src="./assets/nika-mobile-05.png"
            width="390"
            height="1012"
            alt="Один помощник для основных школьных предметов"
            loading="lazy"
          />
        </section>
        <section id="features" aria-label="Возможности Ники">
          <img
            src="./assets/nika-mobile-06.png"
            width="390"
            height="939"
            alt="Всё необходимое, чтобы разобраться со школьной программой"
            loading="lazy"
          />
        </section>
        <section id="parents" aria-label="Для родителей">
          <img
            src="./assets/nika-mobile-07.png"
            width="390"
            height="1338"
            alt="Самостоятельные занятия ребёнка и прогресс для родителей"
            loading="lazy"
          />
        </section>
        <section aria-label="Сравнение вариантов помощи">
          <img
            src="./assets/nika-mobile-08.png"
            width="390"
            height="967"
            alt="Сравнение Ники с поиском, универсальным ИИ и репетитором"
            loading="lazy"
          />
        </section>
        <section id="start" aria-label="Начать заниматься">
          <img
            src="./assets/nika-mobile-09.png"
            width="390"
            height="1287"
            alt="Форма заявки, чтобы начать заниматься с Никой"
            loading="lazy"
          />
        </section>
        <section id="faq" aria-label="Частые вопросы">
          <img
            src="./assets/nika-mobile-10.png"
            width="390"
            height="870"
            alt="Частые вопросы о Нике"
            loading="lazy"
          />
        </section>
        <footer aria-label="Подвал сайта">
          <img
            src="./assets/nika-mobile-11.png"
            width="390"
            height="701"
            alt="Навигация, документы и контакты"
            loading="lazy"
          />
        </footer>
      </div>
    </main>
  </body>
</html>
